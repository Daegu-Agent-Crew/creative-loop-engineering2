name: daeguru-cockpit
# 조종석 아레나 순위 자동 갱신 (2026-W46 자율 개선) — 경기 기록 push → data.json 재계산·커밋
# 사람 손 없이 다음 날 조종석에 최신 순위 반영. 휴대폰이 내려가 있어도 작동.
# 2026-W47 고장 수리: 커밋 스텝에 git commit이 없고 add 후 pull --rebase를 써 7연속 실패.
# 순서 교정: pull → 재계산 → diff → commit → push (게이트 daeguru/gates-w47.mjs가 순서·동작 검증).
on:
  push:
    branches: [main]
    paths: ['hackathon/09-agent-arena/matches/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: daeguru-cockpit, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 아레나 순위 재계산
        run: node daeguru/update-arena.mjs
      - name: 변경 있을 때만 커밋·푸시
        run: |
          git config user.name 'cockpit-bot'
          git config user.email 'cockpit-bot@users.noreply.github.com'
          MSG="data(daeguru): cockpit standings auto-refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash -q || { git rebase --abort 2>/dev/null; sleep 5; continue; }
            node daeguru/update-arena.mjs
            if git diff --quiet -- daeguru/data.json; then echo '변경 없음 — 커밋 생략'; exit 0; fi
            git add daeguru/data.json
            if git commit -m "$MSG" && git push; then exit 0; fi
            sleep 5
          done
          echo '커밋·푸시 3회 실패'
          exit 1
