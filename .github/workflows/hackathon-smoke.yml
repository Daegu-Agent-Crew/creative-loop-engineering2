name: hackathon-smoke
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node hackathon/smoke/smoke.mjs
      - run: node hackathon/smoke/pocket.mjs
      - run: node hackathon/smoke/07-spread.mjs
      - run: node hackathon/07-funding-spread-lab/test/lab.test.mjs
      - run: node hackathon/smoke/06-mirage.mjs
      - run: node hackathon/06-backtest-mirage/test/mirage.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: hackathon-screenshots, path: '*.png' }
